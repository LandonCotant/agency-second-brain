[project]
name = "agency_brain"
version = "0.1.0"
description = "Agency Second Brain"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.20",
    "google-cloud-aiplatform[adk]>=1.46",
    "google-genai>=1.0",  # Modern Vertex/Gemini SDK with ModelArmorConfig support
    "google-cloud-pubsub>=2.21",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-storage>=2.16",
    "requests>=2.32",
]

[project.optional-dependencies]
# ADR 0051 — local stdio MCP server exposing the Brain to Claude
# Desktop / ChatGPT / any MCP-speaking client. Optional extra so the
# Cloud Run agent images don't pull the SDK in.
mcp-server = [
    "mcp>=1.2",
    # Drive/Docs API used by update_weekly_doc and any future tool that
    # wraps Google Workspace APIs. Pinned explicitly here so a fresh
    # `pip install -e .[mcp-server]` picks it up; the Cloud Run agent
    # images already pull it via their per-agent Dockerfile pin sets.
    "google-api-python-client>=2.140",
]

[project.scripts]
asb-mcp-server = "agency_brain.mcp_server.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S603", "S607"]  # subprocess calls in CI scripts are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
