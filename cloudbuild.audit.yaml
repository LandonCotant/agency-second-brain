# Permanent Cloud Build config for the asb-audit runtime image.
#
# Used by manual rebuilds after a code change in src/agency_brain/audit/*
# or Dockerfile.audit lands. The PR-time `cloudbuild.yaml` only verifies the
# Dockerfile builds; this config also pushes the resulting image to AR so
# `gcloud run jobs update` can roll it out.
#
# Invocation (per docs/runbooks/runtime_audit_response.md):
#   gcloud builds submit \
#     --project=agency-brain-demo \
#     --region=us-central1 \
#     --default-buckets-behavior=regional-user-owned-bucket \
#     --config=cloudbuild.audit.yaml \
#     --substitutions=_TAG=<tag> \
#     .
#
# Substitution `_TAG` defaults to `bootstrap` for first-deploy bootstrap.
# After bootstrap, set _TAG to a traceable value tying the image to the
# change that produced it (e.g., `adr-0027-dwd-check`, mirrors the pattern
# used in PR #50 / PR #52 / PR #54).
#
# `serviceAccount:` is set explicitly because ADR 0018 disabled the legacy
# `<projnum>@cloudbuild.gserviceaccount.com` default. asb-cloud-build-sa
# holds `roles/artifactregistry.writer` per foundation/iam.tf so the push
# step succeeds.

substitutions:
  _TAG: bootstrap

serviceAccount: projects/agency-brain-demo/serviceAccounts/asb-cloud-build-sa@agency-brain-demo.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.audit
      - --tag=us-central1-docker.pkg.dev/agency-brain-demo/asb-audit/asb-audit:${_TAG}
      - .

images:
  - us-central1-docker.pkg.dev/agency-brain-demo/asb-audit/asb-audit:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
